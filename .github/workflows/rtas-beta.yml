name: Build untested RTAS BETA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opengridder-private-aax-signing
  cancel-in-progress: false
jobs:
  rtas-beta:
    if: github.repository == 'MistaMin/OpenGridder-Plugins' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, opengridder-aax-release]
    timeout-minutes: 30
    env:
      OPENGRIDDER_LEGACY_APPLE_SDK: ${{ vars.OPENGRIDDER_LEGACY_APPLE_SDK }}
      OPENGRIDDER_LEGACY_CXX_HEADERS: ${{ vars.OPENGRIDDER_LEGACY_CXX_HEADERS }}
      OPENGRIDDER_RTAS_APPLE_SDK: ${{ vars.OPENGRIDDER_RTAS_APPLE_SDK }}
      OPENGRIDDER_LEGACY_SDK: ${{ vars.OPENGRIDDER_LEGACY_PT_SDK }}
      OPENGRIDDER_PRIVATE_WRAPPER_ROOT: ${{ vars.OPENGRIDDER_PRIVATE_WRAPPER_ROOT }}
      OPENGRIDDER_PRIVATE_WRAPPER_REF: ${{ vars.OPENGRIDDER_PRIVATE_WRAPPER_REF }}
      OPENGRIDDER_SIGN_IDENTITY: 'Developer ID Application: Marcos Deida (ZQYU67JUBH)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Snapshot pinned private wrapper commit from licensed build machine
        shell: bash
        run: |
          [[ "$OPENGRIDDER_PRIVATE_WRAPPER_REF" =~ ^[0-9a-f]{40}$ ]]
          git clone --local --no-hardlinks "$OPENGRIDDER_PRIVATE_WRAPPER_ROOT" target/private-wrappers
          git -C target/private-wrappers checkout --detach "$OPENGRIDDER_PRIVATE_WRAPPER_REF"
          test "$(git -C target/private-wrappers rev-parse HEAD)" = "$OPENGRIDDER_PRIVATE_WRAPPER_REF"
      - name: Build and sign actual i386 RTAS BETA
        shell: bash
        run: |
          export OPENGRIDDER_CORE_ROOT="$GITHUB_WORKSPACE"
          bash target/private-wrappers/scripts/build-rtas-macos.sh
      - name: Package only compiled BETA and notices
        shell: bash
        run: |
          mkdir -p target/rtas-beta-artifact target/rtas-package-check
          bundle='target/private-wrappers/build/rtas-i386/OpenGridder RTAS BETA.dpm'
          ditto -c -k --sequesterRsrc --keepParent "$bundle" target/rtas-beta-artifact/OpenGridder-RTAS-BETA-untested.zip
          ditto -x -k target/rtas-beta-artifact/OpenGridder-RTAS-BETA-untested.zip target/rtas-package-check
          codesign --verify --deep --strict --verbose=2 'target/rtas-package-check/OpenGridder RTAS BETA.dpm'
          lipo 'target/rtas-package-check/OpenGridder RTAS BETA.dpm/Contents/MacOS/OpenGridderRTASBeta' -verify_arch i386
          printf '%s\n' 'OpenGridder RTAS BETA: i386, minimum deployment OS X 10.8. Untested in Pro Tools. TDM is not included. No proprietary SDK source/documentation included.' > target/rtas-beta-artifact/README.txt
          printf '%s\n' "$OPENGRIDDER_PRIVATE_WRAPPER_REF" > target/rtas-beta-artifact/wrapper-commit.txt
          cd target/rtas-beta-artifact
          shasum -a 256 OpenGridder-RTAS-BETA-untested.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OpenGridder-RTAS-BETA-untested
          path: target/rtas-beta-artifact/
          if-no-files-found: error
          retention-days: 14
