# Historical path: this file used to build Windows and Linux on GitHub-hosted
# runners and carried the RTAS/TDM job. Only the self-hosted macOS runner can
# build this workspace: Cargo.toml and crates/og-formats/Cargo.toml link
# OpenPluginSDK and GoodLookinDri by absolute macOS path
# ("/Volumes/Developer 2/..."), and the licensed Avid SDK / RTAS/TDM build moved
# to the private OpenGridder-Legacy-Wrappers repository (see LEGACY.md). The
# Windows, Linux and legacy jobs were removed rather than left permanently red.
name: OpenGridder macOS ARM64

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS ARM64 (self-hosted)
    runs-on: [self-hosted, macOS, ARM64, opengridder-aax-release]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # scripts/build-info.sh derives the build number from the full history.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          sw_vers

      - name: Check local Cargo dependencies
        run: |
          set -euo pipefail
          for manifest in \
            "/Volumes/Developer 2/Dependencies/OpenPluginSDK/crates/openplugin/Cargo.toml" \
            "/Volumes/Developer 2/Dependencies/GoodLookinDri/shell/Cargo.toml"; do
            if [ ! -f "$manifest" ]; then
              echo "Missing local Cargo dependency: $manifest" >&2
              echo "Run this job on the macOS build machine that hosts the OpenPluginSDK and GoodLookinDri checkouts." >&2
              exit 1
            fi
          done

      - name: Test workspace libraries
        run: cargo test --workspace --locked --lib

      # scripts/build-all-bundles.sh is a release step: it signs AAX with PACE
      # Eden through a physical iLok and signs every bundle with the Developer ID
      # keychain. CI only compiles and uploads the outputs; run the bundle and
      # packaging scripts on the release machine when signing material is ready.
      - name: Build release outputs
        run: cargo build --release --locked -p og-server -p og-formats -p og-tray

      - name: Record build identity
        run: |
          set -euo pipefail
          source scripts/build-info.sh
          mkdir -p dist
          {
            echo "version: $OG_VERSION"
            echo "build: $OG_BUILD_NUMBER"
            echo "commit: $OG_GIT_COMMIT"
            echo "date: $OG_BUILD_DATE"
          } | tee dist/BUILD-INFO.txt

      - name: Upload compiled outputs and notices
        uses: actions/upload-artifact@v4
        with:
          name: opengridder-macos-arm64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/og-server
            target/release/og-tray
            target/release/libog_formats.dylib
            dist/BUILD-INFO.txt
            COPYING
            LICENSE
            THIRD_PARTY_LICENSES.md
            VERSION
