[workspace]
members = ["crates/ag-protocol", "crates/ag-plugin", "crates/ag-server", "crates/ag-legacy", "crates/ag-formats", "crates/ag-tray"]
resolver = "2"

[workspace.package]
version = "0.1.1-alpha"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
openplugin = { path = "/Volumes/Developer 2/Dependencies/OpenPluginSDK/crates/openplugin" }
ag-protocol = { path = "crates/ag-protocol" }
ag-plugin = { path = "crates/ag-plugin" }
ag-legacy = { path = "crates/ag-legacy" }
ag-tray = { path = "crates/ag-tray" }
