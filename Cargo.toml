[workspace]
members = ["crates/og-protocol", "crates/og-plugin", "crates/og-server", "crates/og-legacy", "crates/og-formats", "crates/og-tray"]
resolver = "2"

[workspace.package]
version = "0.1.1-alpha"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
openplugin = { path = "/Volumes/Developer 2/Dependencies/OpenPluginSDK/crates/openplugin" }
og-protocol = { path = "crates/og-protocol" }
og-plugin = { path = "crates/og-plugin" }
og-legacy = { path = "crates/og-legacy" }
og-tray = { path = "crates/og-tray" }
